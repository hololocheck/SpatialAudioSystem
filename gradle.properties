org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Manta embedded in this jar (jarJar). Single source of truth for: jarJar range floor,
# prefer, compileOnly jar path, and mods.toml required range (expanded by
