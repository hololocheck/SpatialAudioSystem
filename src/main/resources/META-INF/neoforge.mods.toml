loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = ""

[[mods]]
modId = "spatialaudiosystem"
version = "1.0.4"
displayName = "Spatial Audio System"
logoFile = "icon.png"
authors = "hololocheck"
description = '''
A mod that lets you play custom MP3 and OGG audio files in-game.
Includes playback devices, recording devices, recording media, and range specification boards.
'''


# Required Manta floor = the EMBEDDED version (${manta_version} from gradle.properties,
# expanded by processResources). With every consumer declaring [embedded,2), older
# embedded Mantas fall out of the JarJar range intersection and the newest one wins
# deterministically; this mod then runs on it via Manta's <2.0 binary compatibility.
# Manta ships embedded in this jar, so a SAS-only install always satisfies the range.
# (SAS hard-references com.manta.api.image.MantaImage, first shipped in 1.0.7.)
[[dependencies.spatialaudiosystem]]
modId = "manta"
type = "required"
versionRange = "[${manta_version},2)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.spatialaudiosystem]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.spatialaudiosystem]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
