plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = '1.1.0'
group = 'com.spatialaudiosystem'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    // Manta is embedded via jarJar; this is where its obfuscated distributable lives.
    maven { url = 'file:///C:/minecraftmode/manta/repo' }
}

base {
    archivesName = 'spatialaudiosystem'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.77'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'spatialaudiosystem'
            // wiki キャプチャ全自動用: -PwikicapWorld=<saves のフォルダ名> で
            // そのシングルプレイワールドへ直行する (通常起動には影響なし)
            if (project.hasProperty('wikicapWorld')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('wikicapWorld').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'spatialaudiosystem'
        }
    }

    mods {
        spatialaudiosystem {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.spatialaudiosystem
    }
}

dependencies {
    // MP3 SPI for mp3 playback support
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    implementation 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'

    // Manta UI library. Compile against the readable jar for full signatures; ship the
    // obfuscated one embedded (jarJar), so a user running several BelugaLab mods loads a
    // single Manta — some candidate in every mod's range intersection (JarJar does NOT
    // guarantee the newest). Floor = the EMBEDDED version (manta_version in
    // gradle.properties, the single source for range/prefer/jar path/mods.toml): with
    // every consumer declaring [embedded,3), older embedded Mantas fall out of the
    // intersection and the newest one wins deterministically.
    // 2026-09-02 correction: this comment used to end "older mods then run on it via
    // Manta's <2.0 binary compatibility". Manta 2.0 collapsed the public surface onto
    // com.manta.api.**; the obfuscated jar that ships no longer carries the 1.x public
    // types (belugalab.mcss3.screen.*, belugalab.experience.controller.*, ...), so a
    // consumer built against 1.x does not link on 2.x. Measured on the shipped 2.0.0 jar:
    // the readable jar still holds belugalab/** internals, so "deleted belugalab.**" was
    // an overstatement. Mixing a 1.x consumer in empties the range intersection; what
    // NeoForge then reports has not been exercised here.
    compileOnly files("../manta/build/libs/manta-${manta_version}.jar")
    jarJar(implementation("com.manta:manta:[${manta_version},3)")) {
        version { prefer manta_version }
    }

    // Unit-test infrastructure. Mirrors the Manta repo's setup.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.objenesis:objenesis:3.3'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher:1.10.2'
}

// The layout gate reads Manta's icon catalogue from the jar itself: in the unit-test module layer the Manta jar's
// resources are not visible to a test class's getResourceAsStream, and the icon check skipped every layout silently
// until a positive control said so (2026-10-14, found in Orca's copy of the test).
def mantaTestJar = file("../manta/build/libs/manta-${manta_version}.jar")

test {
    useJUnitPlatform()
    systemProperty 'spatialaudiosystem.mantaJar', mantaTestJar.absolutePath
    inputs.file(mantaTestJar).optional().withPropertyName('mantaJar')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

jar {
    // Pull the nested-jar metadata + embedded Manta into the mod jar (ModDevGradle has no
    // jarJar.enable(); this is the equivalent wiring).
    from(tasks.named('jarJar'))
    from {
        configurations.runtimeClasspath.filter {
            it.name.contains('mp3spi') || it.name.contains('jlayer') || it.name.contains('tritonus')
        }.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The deploy loop takes the "-all" jar as the Manta-carrying dev artifact, the same convention TSU
// follows. SAS folds the jarJar output straight into its mod jar, so the two are identical in
// content; publishing the alias keeps one deploy rule working across both mods.
tasks.register('allJar', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into layout.buildDirectory.dir('libs')
    rename { "${base.archivesName.get()}-${version}-all.jar" }
}
tasks.named('build') { dependsOn 'allJar' }

// === Forward half of the Manta compatibility contract (CONCEPT :309, 2026-09-02) ===
// SAS COMPILES against Manta's readable jar and SHIPS the obfuscated one embedded in this
// jar. `build` never compares them - it resolves the readable jar and then never opens the
// jar it just wrote - so a class ProGuard renamed away while SAS still names it surfaces
// only at runtime, as a lazy NoClassDefFoundError in whichever screen opens first.
// Manta's own `mantaCompatGate` cannot ask this (its build has no consumer jar) and since
// Manta 2.0 it says so on every run and names this task. Scanned against the Manta EMBEDDED
// IN THIS JAR, so the verdict is about the artifact, not about ../manta/build/libs.
def mantaCompatGateScript = file('../manta/scripts/compat_gate.py')

tasks.register('mantaLinkGate') {
    group = 'verification'
    description = 'Every Manta class this jar names must exist in the Manta it embeds'
    dependsOn tasks.named('jar')
    doLast {
        if (!mantaCompatGateScript.exists()) {
            throw new GradleException(
                    "manta's compat_gate.py not found at ${mantaCompatGateScript} - this gate " +
                    "needs the Manta checkout beside this one. Refusing rather than reporting " +
                    "a pass it did not measure.")
        }
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        if (!jar.exists()) {
            throw new GradleException("${jar} was not written; nothing to check")
        }
        def proc = ['python', mantaCompatGateScript.absolutePath, '--self',
                    jar.absolutePath].execute()
        def out = new StringBuilder(), err = new StringBuilder()
        proc.waitForProcessOutput(out, err)
        print out.toString()
        print err.toString()
        if (proc.exitValue() != 0) {
            throw new GradleException(
                    "mantaLinkGate: ${jar.name} does not link against the Manta it embeds " +
                    "(compat_gate exit ${proc.exitValue()}). DO NOT SHIP.")
        }
    }
}

// Finalize the task that WRITES the jar, not `build`: `gradlew jar` alone must not slip past.
tasks.named('jar') { finalizedBy 'mantaLinkGate' }
// check is the pre-push condition (there is no CI), so it has to reach the gate too:
// without this, `gradlew check` was green with no statement about whether the jar links
// against the Manta it embeds -- the gate ran only behind assemble/build (review, 2026-09-02).
tasks.named('check') { dependsOn 'mantaLinkGate' }

// MANTA_7_CONCEPT X1: a wiki page in language L names the capture taken in L. The rule lives in manta's script; the
// demand sits here, where the pages are.
def mantaWikiLangGateScript = file('../manta/scripts/manta7_wiki_lang_gate.py')
tasks.register('mantaWikiLangGate') {
    group = 'verification'
    description = "Every wiki page in language L names the capture taken in L"
    doLast {
        if (!mantaWikiLangGateScript.exists()) {
            throw new GradleException("manta's manta7_wiki_lang_gate.py not found at ${mantaWikiLangGateScript} - this " +
                    "gate needs the Manta checkout beside this one. Refusing rather than reporting a pass it did not measure.")
        }
        def proc = ['python', mantaWikiLangGateScript.absolutePath, projectDir.absolutePath].execute()
        def out = new StringBuilder(), err = new StringBuilder()
        proc.waitForProcessOutput(out, err)
        print out.toString()
        print err.toString()
        if (proc.exitValue() != 0) {
            throw new GradleException("mantaWikiLangGate: exit ${proc.exitValue()} - a wiki page names another language's capture, or the gate could not tell")
        }
    }
}
tasks.named('check') { dependsOn 'mantaWikiLangGate' }

// Manta's consumer-reading gates, asked about THIS tree before it ships (2026-10-29). Xenophora 0.10.0 and 0.13.0 passed
// their own check and turned Manta's next check red: keyed nodes the slot vocabulary could not resolve, and shapes
// ConsumerReimplementationGateTest refuses. Manta's check reads this tree the same way, so Manta's own entry points judge
// it here - the slot vocabulary gate's --consumer mode and ConsumerReimplementationRules.java - taken from Manta's
// COMMITTED tree: `git archive` of origin/master in the Manta repository at mantaRoot (-PmantaGateRef names another ref,
// e.g. a Manta branch under development), never that checkout's working tree, which can sit behind origin and carry
// another session's edits. Manta's RECORDS of the consumers (parity captures, the slot vocabulary ledger and its
// baseline) are not asked: every legitimate layout or key change moves them, and only Manta re-freezes them - parity
// with a real client. Xenophora's task; the negative controls are scripts/manta_consumer_gates.mutation.py.
// mantaRoot is the Manta checkout beside this one, or -PmantaRoot (the copies that script writes under build/ pass it).
// Only this task reads it; the paths above name ../manta themselves. This build spells its mod id as a literal
// (mods { spatialaudiosystem }), so it is named here for the task to find this tree in Manta's notes/consumers.json.
def mantaRoot = file(findProperty('mantaRoot') ?: '../manta')
ext.mod_id = 'spatialaudiosystem'
def mantaGateRef = findProperty('mantaGateRef') ?: 'origin/master'
// ConsumerTreeGates.java (2026-10-29) asks seven more of Manta's consumer gates - hit arithmetic, vanilla font, font mix
// with its record of shadowed labels (the user's decision), outside panel transform, dropdown motion, the control glyph
// copy and governance linkability. They read Manta's src/main/java and build.gradle as well, so both are taken.
def mantaGatePaths = ['scripts/manta6_slot_vocabulary_gate.py', 'scripts/manta6_slot_vocabulary.py',
                      'scripts/manta6_workspace.py', 'notes/consumers.json', 'build.gradle', 'src/main/java',
                      'src/test/java/com/manta/api/screen/ConsumerReimplementationRules.java',
                      'src/test/java/com/manta/api/screen/ConsumerTreeGates.java']

tasks.register('mantaConsumerGates') {
    group = 'verification'
    description = "Manta's consumer-reading gates (slot vocabulary resolution, reimplementation rules, seven tree gates) over this tree"
    def javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doLast {
        def capture = { List<String> cmd ->
            def pb = new ProcessBuilder(cmd).directory(projectDir).redirectErrorStream(true)
            pb.environment().put('PYTHONDONTWRITEBYTECODE', '1')
            pb.environment().put('PYTHONIOENCODING', 'utf-8')
            def proc = pb.start()
            def out = new String(proc.inputStream.readAllBytes(), 'UTF-8')
            [proc.waitFor(), out]
        }
        def (revCode, rev) = capture(['git', '-C', mantaRoot.absolutePath, 'rev-parse', '--verify', "${mantaGateRef}^{commit}".toString()])
        if (revCode != 0) {
            throw new GradleException("mantaConsumerGates: ${mantaGateRef} does not resolve in ${mantaRoot} (${rev.trim()}). "
                    + "Refusing rather than reporting a pass it did not measure.")
        }
        def sha = rev.trim()
        // Fresh per run and removed after it: nothing judged here is a copy an earlier run left behind.
        def work = layout.buildDirectory.dir("tmp/mantaConsumerGates/${sha.take(12)}-${System.nanoTime()}").get().asFile
        try {
            work.mkdirs()
            def zip = new File(work, 'manta.zip')
            def (archCode, arch) = capture(['git', '-C', mantaRoot.absolutePath, 'archive', '--format=zip', '-o', zip.absolutePath, sha]
                    + mantaGatePaths)
            if (archCode != 0) {
                throw new GradleException("mantaConsumerGates: Manta ${mantaGateRef} (${sha.take(12)}) lacks the consumer gates' "
                        + "entry points - ${arch.trim()}. Refusing rather than reporting a pass it did not measure.")
            }
            def manta = new File(work, 'manta')
            project.copy { from zipTree(zip); into manta }
            def entry = new groovy.json.JsonSlurper().parse(new File(manta, 'notes/consumers.json')).consumers
                    .find { it.modid == project.mod_id }
            if (entry == null) {
                throw new GradleException("mantaConsumerGates: ${project.mod_id} is not in Manta's notes/consumers.json at "
                        + "${sha.take(12)}, so no Manta gate reads this tree - there is nothing to ask them")
            }
            // Each gate as [name, command, the line that says it judged THIS tree]: a pass is exit 0 with that line and its
            // PASS. Exit 1 with FAIL is a finding, 2 a tree the gate could not read; anything else is no verdict at all.
            def gates = [
                ['slot vocabulary', ['python', new File(manta, 'scripts/manta6_slot_vocabulary_gate.py').absolutePath,
                                     '--consumer', projectDir.absolutePath, '--modid', project.mod_id],
                 "one consumer's textKey nodes vs what its sources push: ${project.mod_id} at"],
                ['reimplementation rules', [javaLauncher.get().executablePath.asFile.absolutePath,
                                            new File(manta, 'src/test/java/com/manta/api/screen/ConsumerReimplementationRules.java').absolutePath,
                                            '--consumer', projectDir.absolutePath, '--folder', entry.folder],
                 "one consumer's sources vs the parts Manta owns: ${entry.folder} at"],
                ['tree gates', [javaLauncher.get().executablePath.asFile.absolutePath,
                                new File(manta, 'src/test/java/com/manta/api/screen/ConsumerTreeGates.java').absolutePath,
                                '--consumer', projectDir.absolutePath, '--folder', entry.folder, '--manta', manta.absolutePath],
                 "one consumer's tree vs seven of Manta's consumer gates: ${entry.folder} at"]]
            def failed = []
            gates.each { name, cmd, judged ->
                def (code, out) = capture(cmd)
                print out
                def verdict = code == 0 && out.contains(judged.toString()) && out.contains('RESULT: PASS') ? 'PASS'
                        : code == 1 && out.contains('RESULT: FAIL') ? 'FAIL'
                        : code == 2 && out.contains('COULD NOT TELL') ? 'COULD NOT TELL'
                        : "NO VERDICT (exit ${code})"
                if (verdict != 'PASS') {
                    failed << "${name}: ${verdict}"
                }
            }
            if (failed) {
                throw new GradleException("mantaConsumerGates: Manta's consumer-reading gates at ${mantaGateRef} (${sha.take(12)}) "
                        + "do not pass this tree - ${failed.join('; ')}. Manta's next check reads this tree and fails on the same "
                        + "findings; fix them here (a false finding: a waiver in Manta) before this ships.")
            }
            logger.lifecycle("mantaConsumerGates: PASS - slot vocabulary, reimplementation rules and the seven tree gates at ${mantaGateRef} (${sha.take(12)})")
        } finally {
            project.delete(work)
        }
    }
}
tasks.named('check') { dependsOn 'mantaConsumerGates' }

// Expand ${manta_version} in mods.toml from gradle.properties, keeping the required
// range in lockstep with the embedded Manta. ${mod_version} comes from the build's own
// version so the declared version cannot drift from the jar's filename — a hardcoded
// literal here once shipped a jar named 1.0.6 that declared 1.0.5.
tasks.withType(ProcessResources).configureEach {
    inputs.property 'manta_version', manta_version
    inputs.property 'mod_version', project.version.toString()
    filesMatching('META-INF/neoforge.mods.toml') {
        expand manta_version: manta_version, mod_version: project.version.toString()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
